[project]
name = "crazytrader"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.40.53",
    "clickhouse-connect==0.9.2",
    "fastapi==0.119.1",
    "nats-py==2.11.0",
    "opentelemetry-api==1.38.0",
    "opentelemetry-sdk==1.38.0",
    "prometheus-client==0.23.1",
    "psycopg[binary]==3.2.12",
    "pydantic==2.12.3",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.3",
    "mypy==1.18.2",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/contracts/src/crazytrader_contracts", "packages/platform/src/crazytrader_platform", "packages/market/src/crazytrader_market", "packages/ledger/src/crazytrader_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
