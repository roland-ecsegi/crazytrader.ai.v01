[project]
name = "crazytrader"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3", "mypy==1.18.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/contracts/src/crazytrader_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
